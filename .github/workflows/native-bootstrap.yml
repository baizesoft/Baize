name: Native bootstrap

on:
  push:
    branches: [dev, 'task/baize-stage0', 'task/baize-elf-packer', 'task/baize-assembler']
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86-64:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Build and verify three native generations
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-evidence
          export BAIZE_BOOTSTRAP_ARTIFACTS="$PWD/ci-evidence"
          bash scripts/check-native-bootstrap.sh 2>&1 | tee ci-evidence/bootstrap.log
      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-bootstrap-linux-x86-64
          path: ci-evidence/

  assembly-cold-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Verify assembly seed and cold start
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-evidence
          export BAIZE_BOOTSTRAP_ARTIFACTS="$PWD/ci-evidence"
          bash scripts/verify-stage0-seed.sh 2>&1 | tee ci-evidence/seed.log
          bash scripts/check-stage0-cold-start.sh 2>&1 | tee ci-evidence/cold-start.log
      - name: Upload assembly cold-start evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: assembly-cold-start-linux-x86-64
          path: ci-evidence/

  baize-elf-packer:
    needs: assembly-cold-start
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: assembly-cold-start-linux-x86-64
          path: gnu-evidence/
      - name: Build with the Baize packer and compare to GNU
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          (
            cd gnu-evidence
            sha256sum --check SEED-SHA256SUMS
          )
          chmod +x gnu-evidence/first-native-compiler
          export BAIZE_BOOTSTRAP_ARTIFACTS="$PWD/ci-evidence"
          bash scripts/check-stage0-no-ld.sh "$PWD/gnu-evidence/first-native-compiler" 2>&1 |
            tee ci-evidence/no-ld.log
          cmp gnu-evidence/first-native-compiler ci-evidence/first
          cmp gnu-evidence/native.*/stage3 ci-evidence/native.*/stage3
          printf 'PASS: 白泽与 GNU 路径的首个编译器及固定点一致\n' |
            tee -a ci-evidence/no-ld.log
      - name: Upload linkerless bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: baize-elf-packer-linux-x86-64
          path: ci-evidence/

  baize-assembler:
    needs: assembly-cold-start
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: assembly-cold-start-linux-x86-64
          path: gnu-evidence/
      - name: Assemble and pack without GNU as or ld
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          (
            cd gnu-evidence
            sha256sum --check SEED-SHA256SUMS
          )
          chmod +x gnu-evidence/first-native-compiler
          export BAIZE_BOOTSTRAP_ARTIFACTS="$PWD/ci-evidence"
          bash scripts/check-stage0-no-binutils.sh "$PWD/gnu-evidence/first-native-compiler" 2>&1 |
            tee ci-evidence/no-binutils.log
          cmp gnu-evidence/native.*/stage3 ci-evidence/native.*/stage3
          printf 'PASS: 白泽汇编与 GNU 路径的固定点一致\n' |
            tee -a ci-evidence/no-binutils.log
      - name: Upload assembler bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: baize-assembler-linux-x86-64
          path: ci-evidence/
